name: Publish image

# Builds the application image, pushes it to Artifact Registry and commits the
# new tag to the Kustomize overlay. Argo CD sees that commit and rolls it out.
# Branch dev publishes to development, branch main to production.

on:
  push:
    branches:
      - main
      - dev
    paths:
      - application/**
      - Dockerfile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target:
    name: Pick the environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=development" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build, push and update the overlay (${{ needs.target.outputs.environment }})
    needs: target
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.environment }}
    permissions:
      contents: write
      id-token: write
    env:
      ENVIRONMENT: ${{ needs.target.outputs.environment }}
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/images/app
    steps:
      # The variables live in the GitHub Environment (see the README). Until they
      # are set there is nothing to publish to, so the job ends here with a
      # notice instead of failing in the sign-in step.
      - name: Check the environment variables
        id: configured
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.PUBLISH_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          if [ -n "$PROVIDER" ] && [ -n "$SERVICE_ACCOUNT" ] && [ -n "$PROJECT" ] && [ -n "$REGION" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Nothing published::GCP_WORKLOAD_IDENTITY_PROVIDER, PUBLISH_SERVICE_ACCOUNT, GCP_PROJECT_ID and GCP_REGION are not all set in the ${ENVIRONMENT} environment. See the README."
          fi

      - uses: actions/checkout@v4
        if: steps.configured.outputs.enabled == 'true'

      - name: Authenticate to Google Cloud with Workload Identity Federation
        id: auth
        if: steps.configured.outputs.enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PUBLISH_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        if: steps.configured.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3
        if: steps.configured.outputs.enabled == 'true'

      - name: Build and push
        if: steps.configured.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Point the overlay at the new image and commit
        if: steps.configured.outputs.enabled == 'true'
        run: |
          file="kubernetes/overlays/${ENVIRONMENT}/kustomization.yaml"
          sed -i -E \
            -e "s|^( *newName:).*|\1 ${IMAGE}|" \
            -e "s|^( *newTag:).*|\1 \"${GITHUB_SHA}\"|" \
            "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "Deploy ${ENVIRONMENT}: image ${GITHUB_SHA::7}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
