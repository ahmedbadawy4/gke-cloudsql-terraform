name: Terraform deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan or apply
        type: choice
        required: true
        options:
          - development
          - production
      apply:
        description: Apply the plan. Leave it off to only plan.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.apply && 'apply' || 'plan' }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # The GitHub Environment holds the variables below and can require a reviewer.
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=gke-cloudsql/${ENVIRONMENT}"

      - name: Plan
        run: |
          terraform plan \
            -var-file="environments/${ENVIRONMENT}.tfvars" \
            -var="project_id=${PROJECT_ID}" \
            -out=tfplan

      - name: Apply
        if: inputs.apply
        run: terraform apply tfplan
