apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-development
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ahmedbadawy4/gke-cloudsql-terraform.git
    targetRevision: dev
    path: kubernetes/overlays/development
  destination:
    server: https://kubernetes.default.svc
    namespace: development
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
